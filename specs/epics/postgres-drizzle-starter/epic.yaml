# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (PD → PD-1, PD-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: postgres-drizzle-starter
  key: PD
spec:
  title: "Vercel's Postgres + Drizzle Next.js Starter on Cloudflare Workers with Supabase Postgres"
  summary: "The Vercel Postgres + Drizzle starter — one page that reads a `profiles` table with Drizzle, seeding it on first use — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare with the database being a Supabase Postgres project reached through Cloudflare Hyperdrive, both provisioned by Terraform through Orun, inside the Lumen baseline's repository conventions. The query and the seed rows stay as written; what moves is where the connection string comes from (the Hyperdrive binding, per request) instead of a module-level POSTGRES_URL client — and, from PD4, where the table comes from: db-migrate applies it, with row-level security, before the app serves, and the repository is an Orun baseline that instantiates the whole product in one landing."
  state: started
  milestones:
    - name: "PD0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [PD-1]
    - name: "PD1 — the profiles table on Workers"
      exitCriteria:
        - "apps/web is the upstream template with lib/db.ts opening a Postgres client per call from the HYPERDRIVE binding"
        - "the wrangler config renders per environment from the cloudflare-hyperdrive root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` boots the Worker, serves the static shell and reaches for the local Postgres through the binding"
      tasks: [PD-2]
    - name: "PD2 — Supabase and Hyperdrive from Terraform"
      exitCriteria:
        - "infra/terraform/supabase and infra/terraform/cloudflare-hyperdrive provision the stage and prod project and config and publish the wiring document the app renders from"
      tasks: [PD-3]
    - name: "PD3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, locally against the Supabase CLI or any Postgres"
        - "the as-built status records every departure from the upstream template"
      tasks: [PD-4]
    - name: "PD4 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card, requires [github, cloudflare, supabase]) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing, then record it (01-product, 02-docs)"
        - "the schema is applied by db-migrate (packages/db) before the app serves, with row-level security on every table in public; the page writes only the seed rows, safely under concurrent first requests"
        - "the product's own push-to-main plan converges supabase → cloudflare-hyperdrive → db-migrate → web per environment, every edge enforced on main and advisory on a pull request"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the product's plans, and the end-to-end tier"
      tasks: [PD-5]
    - name: "PD5 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [PD-6, PD-7]
