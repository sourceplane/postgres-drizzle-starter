apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The profiles table demo (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # Hyperdrive (and behind it the Supabase project) must exist before this
  # deploys: its id is rendered into the wrangler config from the
  # cloudflare-hyperdrive root's wiring document.
  dependsOn:
    - component: cloudflare-hyperdrive
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://postgres-drizzle-starter/postgres-drizzle-starter/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://postgres-drizzle-starter/postgres-drizzle-starter/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: postgres-drizzle-starter-web-{dev,stage,prod}.
    workerName: postgres-drizzle-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config from the wiring document, then
    # build with the environment's Worker URL as the site origin.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-hyperdrive --env "${ORUN_ENVIRONMENT}" && NEXT_PUBLIC_SITE_URL="https://postgres-drizzle-starter-web-${ORUN_ENVIRONMENT}.${WORKERS_DEV_SUBDOMAIN}.workers.dev" pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders and carries the app's marker text.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Postgres on Cloudflare'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
