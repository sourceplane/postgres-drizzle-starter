apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The upstream Postgres + Drizzle starter runs on Cloudflare Workers with Postgres through the Hyperdrive binding, a per-environment rendered wrangler config and green checks
  affects:
    - apps/web
    - tests/web
    - pnpm-lock.yaml
    - package.json
    - turbo.json
  doneWhen:
    - pnpm wire:fixture, typecheck, lint, test and build are green in Checks
    - wrangler dev boots the Worker and reaches for Postgres through the binding
  gates:
    - checks
